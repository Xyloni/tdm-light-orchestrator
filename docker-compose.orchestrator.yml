services:
  orchestrator:
    build: .
    image: tdm-light:orchestrator
    command: ["--orchestrator"]
    network_mode: host
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      ORCHESTRATOR_DIR: /data/orchestrator
      ORCHESTRATOR_WEB_ADDR: 127.0.0.1:8787
    volumes:
      - ./data-orchestrator:/data
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
